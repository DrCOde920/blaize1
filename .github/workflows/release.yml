name: Blaize Release Packaging & Manifest Generation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v3.2.0)'
        required: true
        default: 'v3.2.0'

jobs:
  build-release-matrix:
    name: Build & Check Release Artifacts (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            asset_ext: tar.gz
          - os: macos-latest
            target: mac
            asset_ext: tar.gz
          - os: windows-latest
            target: win
            asset_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run 9-Gate Verification
        run: npm run verify

      - name: Package Release Bundle
        run: npm run desktop:package:${{ matrix.target }}
        env:
          SOURCE_DATE_EPOCH: '1730678400'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*/artifact-manifest.json
