name: Blaize CI/CD Security & Verification Pipeline

on:
  push:
    branches: [ main, remediation/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies (Frozen Lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Run Test Suite
        run: bun run test

      - name: Run 9-Gate Honest Verification Pipeline
        run: bun run verify

      - name: Build Application Bundle
        run: bun run build
